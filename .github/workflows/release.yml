name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      # dtolnay/rust-toolchain "stable" branch as of 2026-11-25
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          targets: x86_64-pc-windows-msvc

      # v2.8.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
        with:
          workspaces: "."

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix app ci

      # v0.5.24
      - name: Build and publish
        uses: tauri-apps/tauri-action@3b50ac4d4512105f96edbaa78a6e2f9392805589
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Manka ${{ github.ref_name }}"
          releaseBody: "Сборка Manka ${{ github.ref_name }}. Установщик и файл обновления приложены ниже."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis
