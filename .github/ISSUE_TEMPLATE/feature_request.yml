name: Предложение / Feature request
description: Идея новой функции или улучшения
title: "[Предложение] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает
      description: Что сейчас неудобно или невозможно?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как вы видите эту функцию в Manka?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Как вы решаете эту задачу сейчас?
