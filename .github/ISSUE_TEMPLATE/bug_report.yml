name: Проблема / Bug report
description: Что-то не работает — сайт не открывается, обход падает, ошибка в приложении
title: "[Проблема] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что помогаете делать Manka лучше! Перед отправкой:
        1. Откройте **Диагностика → Проверить снова** и посмотрите, нет ли там красных пунктов.
        2. Нажмите **Экспорт для issue** — получите zip с журналами и результатами проверки.
        3. Приложите zip к обращению (или вставьте текст из doctor.txt ниже).

  - type: input
    id: version
    attributes:
      label: Версия Manka
      placeholder: например, 0.4.0 (видна внизу слева в приложении)
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: например, Windows 11 24H2
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Провайдер интернета и регион
      placeholder: например, МТС, Москва
    validations:
      required: true

  - type: input
    id: strategy
    attributes:
      label: Активная стратегия
      placeholder: название с главного экрана, например «ALT9 (hostfakesplit)»

  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы делали, что ожидали и что произошло на самом деле
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Результат «Диагностики»
      description: Вставьте текст из doctor.txt (кнопка «Экспорт для issue») или скриншот вкладки «Диагностика»
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Чек-лист
      options:
        - label: Я искал решение в README и среди существующих issues
          required: true
        - label: Я запускал Manka от имени администратора
          required: true
        - label: Я пробовал другую стратегию / автоподбор — не помогло
          required: false
